backend:
  name: github
  repo: MrFizzywater/nate-portfolio
  branch: main
  base_url: https://auth.erikalacroix.com

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # 1. Photography (Masonry Feed)
  - name: "photos"
    label: "Photography"
    folder: "src/content/photos"
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Year", name: "year", widget: "number", value_type: "int", default: 2026 }
      - { label: "Photo File", name: "image", widget: "image" }
      - { label: "Category / Series", name: "category", widget: "string", default: "Landscape" }
      - { label: "Caption / Story", name: "body", widget: "markdown", required: false }

  # 2. Site Pages (About & Contact)
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/pages/about.md"
        label: "About & Artist Bio"
        name: "about"
        fields:
          - { label: "Page Title", name: "title", widget: "string", default: "About Nate Lacroix" }
          - { label: "Headline / Focus", name: "headline", widget: "string", default: "Media artist, filmmaker, and photographer based in Midland, Ontario." }
          - { label: "Portrait / Studio Photo", name: "portrait", widget: "image", required: false }
          - { label: "Bio / Statement", name: "body", widget: "markdown" }

      - file: "src/content/pages/contact.md"
        label: "Contact & Inquiries"
        name: "contact"
        fields:
          - { label: "Heading", name: "title", widget: "string", default: "Get In Touch" }
          - { label: "Introductory Note", name: "intro", widget: "text" }
          - { label: "Email Address", name: "email", widget: "string", default: "nate@natelacroix.com" }
          - { label: "Location", name: "location", widget: "string", default: "Midland, ON, Canada" }
          - { label: "Instagram Link", name: "instagram", widget: "string", required: false }

  # 3. Global Branding & Header Settings
  - name: "settings"
    label: "Site Settings"
    delete: false
    files:
      - file: "src/content/settings/general.json"
        label: "Header & Branding"
        name: "general"
        format: "json"
        fields:
          - { label: "Header Site Title", name: "siteTitle", widget: "string", default: "Nate Lacroix" }
          - { label: "Header Subtitle / Tagline", name: "tagline", widget: "string", default: "Photography • Moving Image" }
          - { label: "Logo Image (Optional)", name: "logo", widget: "image", required: false }
